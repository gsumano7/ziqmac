<text x="312.000" y="22.000" class="tb" text-anchor="start">FOLD / CLOSING SEQUENCE</text>
<text x="312.000" y="25.850" class="ts" text-anchor="start">1. Pages stand up from the bottom gusset.</text>
<text x="312.000" y="29.700" class="ts" text-anchor="start">2. Fold both side flaps in over the pages;</text>
<text x="312.000" y="33.550" class="ts" text-anchor="start">   they tuck inside the front panel.</text>
<text x="312.000" y="37.400" class="ts" text-anchor="start">3. Fold the front panel up; its inner-face</text>
<text x="312.000" y="41.250" class="ts" text-anchor="start">   sockets snap onto the side-flap studs.</text>
<text x="312.000" y="45.100" class="ts" text-anchor="start">4. Fold the top gusset + flap over the front.</text>
<text x="312.000" y="48.950" class="ts" text-anchor="start">5. Pass the strap tongue through the buckle</text>
<text x="312.000" y="52.800" class="ts" text-anchor="start">   and keeper; snap it to the front-panel stud.</text>
<text x="312.000" y="56.650" class="ts" text-anchor="start"></text>
