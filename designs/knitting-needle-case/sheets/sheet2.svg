<text x="185.000" y="25.900" class="ts" text-anchor="start">1. Fold the four walls up 90 deg from the base</text>
<text x="185.000" y="29.800" class="ts" text-anchor="start">   (rear 6.5, front 6.0, sides 5.7).</text>
<text x="185.000" y="33.700" class="ts" text-anchor="start">2. Glue / stitch the corner tabs (not shown; add</text>
<text x="185.000" y="37.600" class="ts" text-anchor="start">   1.5 cm tabs on the side walls if a rigid box).</text>
<text x="185.000" y="41.500" class="ts" text-anchor="start">3. Fit interior: panel A to base (sheet 3), page</text>
<text x="185.000" y="45.400" class="ts" text-anchor="start">   hinge to front wall inner face (sheets 5-6),</text>
<text x="185.000" y="49.300" class="ts" text-anchor="start">   panel B to lid inner face (sheet 4).</text>
<text x="185.000" y="53.200" class="ts" text-anchor="start">4. Fold rear flap (5.0) inward over the contents.</text>
<text x="185.000" y="57.100" class="ts" text-anchor="start">5. Close lid over the front-wall hinge.</text>
<text x="185.000" y="61.000" class="ts" text-anchor="start">6. Fold both end flaps over the lid; snap.</text>
<text x="30.000" y="173.000" class="tb" text-anchor="start">INTERIOR LAYOUT - open, lid folded flat, viewed from above (1:4)</text>
