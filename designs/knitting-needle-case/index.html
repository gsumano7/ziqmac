<text x="288.000" y="71.900" class="ts" text-anchor="start">1. All dimensions in cm, finished (net) sizes as measured</text>
<text x="288.000" y="75.800" class="ts" text-anchor="start">   on the cardboard prototype. No seam allowance included:</text>
<text x="288.000" y="79.700" class="ts" text-anchor="start">   add 0.8 for turned seams, 0 for bound / edge-painted</text>
<text x="288.000" y="83.600" class="ts" text-anchor="start">   edges (reference shows edge-stitched, turned edges).</text>
<text x="288.000" y="87.500" class="ts" text-anchor="start">2. Drawn with the OUTER face up (strap, buckle, logo side).</text>
<text x="288.000" y="91.400" class="ts" text-anchor="start">   Pattern assumed symmetrical about its vertical centre</text>
<text x="288.000" y="95.300" class="ts" text-anchor="start">   line; left side measured equal to the right (5.7 / 8.0).</text>
<text x="288.000" y="99.200" class="ts" text-anchor="start">3. Construction: trifold clutch (reference photos). Side</text>
<text x="288.000" y="103.100" class="ts" text-anchor="start">   flaps fold in and tuck inside, front panel folds up over</text>
<text x="288.000" y="107.000" class="ts" text-anchor="start">   them, top flap folds down, strap tongue snaps to the</text>
<text x="288.000" y="110.900" class="ts" text-anchor="start">   front panel. Pages are sewn into the bottom gusset.</text>
<text x="288.000" y="114.800" class="ts" text-anchor="start">4. Gusset depths as measured: 5.7 (sides), 6.0 (bottom),</text>
<text x="288.000" y="118.700" class="ts" text-anchor="start">   6.5 (top). Top 6.5 gives the flap room over the front</text>
<text x="288.000" y="122.600" class="ts" text-anchor="start">   panel; keep as measured (Q1, sheet 2).</text>
<text x="288.000" y="126.500" class="ts" text-anchor="start">5. Snaps: 12.5 mm (line 20) spring snaps: 2 on the side</text>
<text x="288.000" y="130.400" class="ts" text-anchor="start">   flaps, 1 strap tongue, 1 accessory pocket. Set the</text>
<text x="288.000" y="134.300" class="ts" text-anchor="start">   front-panel sockets and strap stud from a dry fold.</text>
<text x="288.000" y="138.200" class="ts" text-anchor="start">6. Outer: faux leather (PU) 1.0-1.2 mm, tan; strap dark</text>
<text x="288.000" y="142.100" class="ts" text-anchor="start">   brown. Stiffen back and front panels with 1.0 mm board.</text>
<text x="288.000" y="146.000" class="ts" text-anchor="start">   Lining: faux leather 0.6 mm, same tan (reference).</text>
<text x="288.000" y="149.900" class="ts" text-anchor="start">7. Reference photos show a deeper top flap (about 9-10) and</text>
<text x="288.000" y="153.800" class="ts" text-anchor="start">   the buckle lower down; prototype gives 5.0 - confirm (Q2).</text>

<text x="258.000" y="81.400" class="tb" text-anchor="start">PAGE CONSTRUCTION (all four pages)</text>
<text x="258.000" y="85.100" class="ts" text-anchor="start">1. Page = 2 plies faux leather 1.0 mm over 0.8 mm board</text>
<text x="258.000" y="88.800" class="ts" text-anchor="start">   stiffener, 20.0 x 12.5, R 1.0 top corners, edge-stitched</text>
<text x="258.000" y="92.500" class="ts" text-anchor="start">   0.3 in contrast thread (as reference photos).</text>
<text x="258.000" y="96.200" class="ts" text-anchor="start">2. Elastic: 15 mm knit elastic in matching colour, laid</text>
<text x="258.000" y="99.900" class="ts" text-anchor="start">   flat and stitched on every line shown. Slot widths are</text>
<text x="258.000" y="103.600" class="ts" text-anchor="start">   the prototype's: 0.6 for 2.0 mm, +0.1 per size step, to</text>
<text x="258.000" y="107.300" class="ts" text-anchor="start">   2.2 for 10 mm. One slot holds one PAIR, side by side.</text>
<text x="258.000" y="111.000" class="ts" text-anchor="start">3. Stitch lines in pairs 0.5 apart between slots (the</text>
<text x="258.000" y="114.700" class="ts" text-anchor="start">   'land'); bar-tack both ends of each line.</text>
<text x="258.000" y="118.400" class="ts" text-anchor="start">4. Size labels heat-stamped / printed above each slot</text>
<text x="258.000" y="122.100" class="ts" text-anchor="start">   with a 0.5 leader line to the tip (reference photo).</text>
<text x="258.000" y="125.800" class="ts" text-anchor="start">5. Hinge tab 1.5 below the page is sewn into the bottom</text>
<text x="258.000" y="129.500" class="ts" text-anchor="start">   gusset - pages are not removable (sheet 7, detail C).</text>
<text x="258.000" y="133.200" class="ts" text-anchor="start">6. Tip points up; 1.5 clear above the points (prototype).</text>

<text x="258.000" y="60.400" class="tb" text-anchor="start">PAGE CONSTRUCTION (all four pages)</text>
<text x="258.000" y="64.100" class="ts" text-anchor="start">1. Page = 2 plies faux leather 1.0 mm over 0.8 mm board</text>
<text x="258.000" y="67.800" class="ts" text-anchor="start">   stiffener, 20.0 x 12.5, R 1.0 top corners, edge-stitched</text>
<text x="258.000" y="71.500" class="ts" text-anchor="start">   0.3 in contrast thread (as reference photos).</text>
<text x="258.000" y="75.200" class="ts" text-anchor="start">2. Elastic: 15 mm knit elastic in matching colour, laid</text>
<text x="258.000" y="78.900" class="ts" text-anchor="start">   flat and stitched on every line shown. Slot widths are</text>
<text x="258.000" y="82.600" class="ts" text-anchor="start">   the prototype's: 0.6 for 2.0 mm, +0.1 per size step, to</text>
<text x="258.000" y="86.300" class="ts" text-anchor="start">   2.2 for 10 mm. One slot holds one PAIR, side by side.</text>
<text x="258.000" y="90.000" class="ts" text-anchor="start">3. Stitch lines in pairs 0.5 apart between slots (the</text>
<text x="258.000" y="93.700" class="ts" text-anchor="start">   'land'); bar-tack both ends of each line.</text>
<text x="258.000" y="97.400" class="ts" text-anchor="start">4. Size labels heat-stamped / printed above each slot</text>
<text x="258.000" y="101.100" class="ts" text-anchor="start">   with a 0.5 leader line to the tip (reference photo).</text>
<text x="258.000" y="104.800" class="ts" text-anchor="start">5. Hinge tab 1.5 below the page is sewn into the bottom</text>
<text x="258.000" y="108.500" class="ts" text-anchor="start">   gusset - pages are not removable (sheet 7, detail C).</text>
<text x="258.000" y="112.200" class="ts" text-anchor="start">6. Tip points up; 1.5 clear above the points (prototype).</text>
<text x="258.000" y="119.900" class="tb" text-anchor="start">PAGE 2 NOTE</text>
<text x="258.000" y="123.600" class="ts" text-anchor="start">- 6 slots use 14.2 of the 20.0 width; the strip is</text>
<text x="258.000" y="127.300" class="ts" text-anchor="start">  centred (2.9 margins). The 10 mm pair is the thickest</text>
<text x="258.000" y="131.000" class="ts" text-anchor="start">  item in the case (1.0) - see stack check, sheet 2.</text>

<text x="258.000" y="81.400" class="tb" text-anchor="start">PAGE CONSTRUCTION (all four pages)</text>
<text x="258.000" y="85.100" class="ts" text-anchor="start">1. Page = 2 plies faux leather 1.0 mm over 0.8 mm board</text>
<text x="258.000" y="88.800" class="ts" text-anchor="start">   stiffener, 20.0 x 12.5, R 1.0 top corners, edge-stitched</text>
<text x="258.000" y="92.500" class="ts" text-anchor="start">   0.3 in contrast thread (as reference photos).</text>
<text x="258.000" y="96.200" class="ts" text-anchor="start">2. Elastic: 15 mm knit elastic in matching colour, laid</text>
<text x="258.000" y="99.900" class="ts" text-anchor="start">   flat and stitched on every line shown. Slot widths are</text>
<text x="258.000" y="103.600" class="ts" text-anchor="start">   the prototype's: 0.6 for 2.0 mm, +0.1 per size step, to</text>
<text x="258.000" y="107.300" class="ts" text-anchor="start">   2.2 for 10 mm. One slot holds one PAIR, side by side.</text>
<text x="258.000" y="111.000" class="ts" text-anchor="start">3. Stitch lines in pairs 0.5 apart between slots (the</text>
<text x="258.000" y="114.700" class="ts" text-anchor="start">   'land'); bar-tack both ends of each line.</text>
<text x="258.000" y="118.400" class="ts" text-anchor="start">4. Size labels heat-stamped / printed above each slot</text>
<text x="258.000" y="122.100" class="ts" text-anchor="start">   with a 0.5 leader line to the tip (reference photo).</text>
<text x="258.000" y="125.800" class="ts" text-anchor="start">5. Hinge tab 1.5 below the page is sewn into the bottom</text>
<text x="258.000" y="129.500" class="ts" text-anchor="start">   gusset - pages are not removable (sheet 7, detail C).</text>
<text x="258.000" y="133.200" class="ts" text-anchor="start">6. Tip points up; 1.5 clear above the points (prototype).</text>
<text x="258.000" y="140.900" class="tb" text-anchor="start">PAGE 3 NOTE</text>

<text x="258.000" y="152.000" class="ts" text-anchor="start">- 5 cm tips sit centred on the page (reference photo):</text>

<text x="258.000" y="100.100" class="tb" text-anchor="start">PAGE CONSTRUCTION (all four pages)</text>

<text x="258.000" y="107.500" class="ts" text-anchor="start">   stiffener, 20.0 x 12.5, R 1.0 top corners, edge-stitched</text>

<text x="258.000" y="114.900" class="ts" text-anchor="start">2. Elastic: 15 mm knit elastic in matching colour, laid</text>

<text x="258.000" y="129.700" class="ts" text-anchor="start">3. Stitch lines in pairs 0.5 apart between slots (the</text>

<text x="258.000" y="137.100" class="ts" text-anchor="start">4. Size labels heat-stamped / printed above each slot</text>

<text x="150.000" y="101.000" class="tb" text-anchor="start">CONSTRUCTION SEQUENCE</text>
<text x="150.000" y="104.800" class="ts" text-anchor="start">1. Cut outer shell, lining and board (sheet 1). Emboss the logo on the top flap while flat.</text>
<text x="150.000" y="108.600" class="ts" text-anchor="start">2. Stitch the strap to the outer shell (back panel + top gusset + top flap); add buckle piece and keeper.</text>
<text x="150.000" y="112.400" class="ts" text-anchor="start">3. Make the four pages (sheets 3-6): stitch elastics and labels on the face plies, add the pocket to page 4,</text>
<text x="150.000" y="116.200" class="ts" text-anchor="start">   then laminate face + board + back ply and edge-stitch, leaving the hinge tab single-ply.</text>
<text x="150.000" y="120.000" class="ts" text-anchor="start">4. Stitch the cable pocket to the back-panel lining. Set the side-flap studs and front-panel sockets.</text>
<text x="150.000" y="123.800" class="ts" text-anchor="start">5. Stitch the page hinge tabs through the bottom gusset in order P1-P4 (sheet 7, detail C).</text>
<text x="150.000" y="127.600" class="ts" text-anchor="start">6. Laminate lining to shell with board in back and front panels; turn and edge-stitch 0.3 all round.</text>
<text x="150.000" y="131.400" class="ts" text-anchor="start">7. Dry-fold; set the strap stud on the front panel and the socket in the tongue; check all snaps.</text>
<text x="150.000" y="135.200" class="ts" text-anchor="start">8. Load the set per the contents checklist; check the closed case has no pressure on the 10 mm tips.</text>
<text x="150.000" y="139.000" class="ts" text-anchor="start"></text>
<text x="150.000" y="142.800" class="tb" text-anchor="start">TOLERANCES</text>
<text x="150.000" y="146.600" class="ts" text-anchor="start">Cut pieces +/- 0.1 cm; elastic stitch lines +/- 0.05 cm (the 0.6 slot must still take two 2 mm tips);</text>
<text x="150.000" y="150.400" class="ts" text-anchor="start">snap centres +/- 0.15 cm; page hinge seams +/- 0.1 cm.</text>
