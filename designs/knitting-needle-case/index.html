<text x="212.000" y="260.200" class="tx" text-anchor="start">PROJECT</text>
<text x="212.000" y="264.800" class="tb" text-anchor="start">INTERCHANGEABLE KNITTING NEEDLE CASE</text>
<text x="332.000" y="260.200" class="tx" text-anchor="start">CLIENT</text>
<text x="332.000" y="264.800" class="t" text-anchor="start">gsumano7 / ziqmac</text>
<text x="212.000" y="270.200" class="tx" text-anchor="start">SHEET TITLE</text>
<text x="212.000" y="274.800" class="tb" text-anchor="start">Cover - design brief, design views, sheet index</text>
<text x="332.000" y="270.200" class="tx" text-anchor="start">SCALE</text>
<text x="332.000" y="274.800" class="t" text-anchor="start">-</text>
<text x="372.000" y="270.200" class="tx" text-anchor="start">UNITS</text>
<text x="372.000" y="274.800" class="t" text-anchor="start">cm (page A3)</text>
<text x="212.000" y="280.200" class="tx" text-anchor="start">SOURCE</text>
<text x="212.000" y="284.800" class="t" text-anchor="start">Cardboard prototype P1-P5 + client brief, logo and reference photos R1-R6</text>
<text x="332.000" y="280.200" class="tx" text-anchor="start">DATE / REV</text>
<text x="332.000" y="284.800" class="t" text-anchor="start">2026-10-01   Rev E</text>
<text x="372.000" y="280.200" class="tx" text-anchor="start">SHEET</text>
<text x="372.000" y="284.800" class="tb" text-anchor="start">1 of 9</text>
<text x="13.000" y="17.000" class="tt" text-anchor="start">SHEET 1  -  COVER - DESIGN BRIEF, DESIGN VIEWS, SHEET INDEX</text>
<text x="14.000" y="22.000" class="tb" text-anchor="start">DESIGN BRIEF (client, 2026-10-01)</text>
<text x="14.000" y="25.750" class="ts" text-anchor="start">Premium interchangeable knitting-needle case in genuine or faux leather:</text>
<text x="14.000" y="29.500" class="ts" text-anchor="start">structured construction, finished edge stitching, folding side flaps, top flap,</text>
<text x="14.000" y="33.250" class="ts" text-anchor="start">and a leather strap with metal hardware that wraps the whole case. Minimal</text>
<text x="14.000" y="37.000" class="ts" text-anchor="start">and premium in appearance - not a fabric organiser. The case opens fully.</text>
<text x="14.000" y="40.750" class="ts" text-anchor="start">- Snaps hold the front panel to the two folded side flaps.</text>
<text x="14.000" y="44.500" class="ts" text-anchor="start">- The strap closes everything: buckle and keeper are visual, the strap tongue</text>
<text x="14.000" y="48.250" class="ts" text-anchor="start">  snaps to a stud on the front panel. Client logo embossed on the top flap.</text>
<text x="14.000" y="52.000" class="ts" text-anchor="start"></text>
<text x="14.000" y="55.750" class="tb" text-anchor="start">STORAGE SURFACES - front to back</text>
<text x="14.000" y="59.500" class="ts" text-anchor="start">Front panel  &gt;  Panel 1  &gt;  Panel 2  &gt;  Panel 3  &gt;  Back wall (Panel 4)</text>
<text x="14.000" y="63.250" class="ts" text-anchor="start">- Panels 1-3 are separate leather pages, permanently sewn into the bottom of</text>
<text x="14.000" y="67.000" class="ts" text-anchor="start">  the case, evenly spaced, and able to flip individually like book pages.</text>
<text x="14.000" y="70.750" class="ts" text-anchor="start">  They are NOT removable.</text>
<text x="14.000" y="74.500" class="ts" text-anchor="start">- Panel 4 is the inside back wall of the case itself: the needle loops are</text>
<text x="14.000" y="78.250" class="ts" text-anchor="start">  sewn / threaded directly into the back-wall lining. It also carries the</text>
<text x="14.000" y="82.000" class="ts" text-anchor="start">  large snap pocket for the cables.</text>
<text x="14.000" y="85.750" class="ts" text-anchor="start">- Panel 2 carries two small snap pockets for the accessories.</text>
<text x="14.000" y="89.500" class="ts" text-anchor="start">- Every pair of tips has its own elastic loop, threaded in and out of the</text>
<text x="14.000" y="93.250" class="ts" text-anchor="start">  panel, with the needle size marked above the pair.</text>
<text x="14.000" y="97.000" class="ts" text-anchor="start"></text>
<text x="14.000" y="100.750" class="tb" text-anchor="start">CONTENTS TO BE HOUSED</text>
<text x="14.000" y="104.500" class="ts" text-anchor="start">34 x 10 cm tips (17 pairs, 2.0-10 mm)   on panels 1 and 2</text>
<text x="14.000" y="108.250" class="ts" text-anchor="start">30 x 5 cm tips (15 pairs, 2.0-8 mm)     on panels 3 and 4</text>
<text x="14.000" y="112.000" class="ts" text-anchor="start">5 cables 25 / 40 / 60 / 80 / 100 cm      back-wall pocket (panel 4)</text>
<text x="14.000" y="115.750" class="ts" text-anchor="start">6 end caps, 4 keys, 3 connectors,        panel 2 pockets</text>
<text x="14.000" y="119.500" class="ts" text-anchor="start">1 leather grip patch (replaces the rubber grip disc)</text>
<text x="14.000" y="123.250" class="ts" text-anchor="start"></text>
<text x="14.000" y="127.000" class="tb" text-anchor="start">CLOSED SIZE  21.0 x 13.0 x 6.0 cm  (W x H x D, from the cardboard prototype)</text>
<text x="14.000" y="130.750" class="ts" text-anchor="start"></text>
<text x="14.000" y="134.500" class="tb" text-anchor="start">MATERIALS</text>
<text x="14.000" y="138.250" class="ts" text-anchor="start">Outer: full-grain leather 1.2-1.4 mm, tan (or PU faux leather 1.0-1.2 mm).</text>
<text x="14.000" y="142.000" class="ts" text-anchor="start">Strap: 1.4 mm, dark brown. Lining and pages: 0.6-1.0 mm matching leather.</text>
<text x="14.000" y="145.750" class="ts" text-anchor="start">Hardware: antique brass - 30 mm buckle (decorative), 12.5 mm and 10 mm snaps.</text>
<text x="14.000" y="149.500" class="ts" text-anchor="start">Elastic: 15 mm knit, colour-matched. Thread: bonded polyester, contrast.</text>
<text x="14.000" y="153.250" class="ts" text-anchor="start"></text>
<text x="14.000" y="157.000" class="tb" text-anchor="start">LOGO (client artwork, right)  blind / heat emboss 2.5 x 2.5 on the top flap,</text>
<text x="14.000" y="160.750" class="ts" text-anchor="start">centred 3.0 from the right edge and 8.0 below the top of the closed case (sheet 2).</text>
<text x="14.000" y="164.500" class="ts" text-anchor="start">Vector artwork to be supplied for the emboss die; raster shown for placement.</text>
<text x="14.000" y="168.250" class="ts" text-anchor="start"></text>
<text x="14.000" y="172.000" class="tb" text-anchor="start">TOP FLAP 10.0 deep, as in the reference photos (client decision); the cardboard</text>
<text x="14.000" y="175.750" class="ts" text-anchor="start">prototype measured 5.0. Pockets sized to the maximum that leaves the needle</text>
<text x="14.000" y="179.500" class="ts" text-anchor="start">zones intact: cable pocket 9.7 x 9.0, accessory pockets 3.9 x 4.1 (sheets 5, 7).</text>
<text x="14.000" y="183.250" class="ts" text-anchor="start"></text>
<text x="14.000" y="187.000" class="tb" text-anchor="start">SHEET INDEX</text>
<text x="14.000" y="190.750" class="ts" text-anchor="start">1  Cover (this sheet)</text>
<text x="14.000" y="194.500" class="ts" text-anchor="start">2  Outer shell - flat pattern, outer face</text>
<text x="14.000" y="198.250" class="ts" text-anchor="start">3  Assembly - closed views, section, open layout, closing sequence</text>
<text x="14.000" y="202.000" class="ts" text-anchor="start">4  Panel 1 (page): 10 cm tips 2.0-5.0 mm</text>
<text x="14.000" y="205.750" class="ts" text-anchor="start">5  Panel 2 (page): 10 cm tips 5.5-10 mm + two accessory pockets</text>
<text x="14.000" y="209.500" class="ts" text-anchor="start">6  Panel 3 (page): 5 cm tips 2.0-5.0 mm</text>
<text x="14.000" y="213.250" class="ts" text-anchor="start">7  Panel 4 (back wall): 5 cm tips 5.5-8 mm + cable pocket</text>
<text x="14.000" y="217.000" class="ts" text-anchor="start">8  Details: strap, elastic threading, page hinge, pockets</text>
<text x="14.000" y="220.750" class="ts" text-anchor="start">9  Contents checklist, bill of materials, construction</text>

<text x="218.000" y="143.750" class="ts" text-anchor="start">- Dimensions come from the client's cardboard prototype (21.0 x 13.0 base, 6.0</text>

<text x="218.000" y="151.250" class="ts" text-anchor="start">- Construction follows the client's reference photos (kept in reference/) and</text>
<text x="218.000" y="155.000" class="ts" text-anchor="start">  brief; where photos and prototype differed (flap depth) the client chose 10.0.</text>
<text x="218.000" y="158.750" class="ts" text-anchor="start">- The views above are drawn from the same geometry as sheets 2-8, so they show</text>
<text x="218.000" y="162.500" class="ts" text-anchor="start">  the case as specified: logo upright on the closed flap, pockets at final size.</text>
<text x="218.000" y="166.250" class="ts" text-anchor="start">- Sheets 4-7 are full size (1:1): print at 100 % for slit-cutting templates.</text>
<text x="218.000" y="170.000" class="ts" text-anchor="start">- Open questions for the factory / client are listed on sheet 3.</text>

<text x="288.000" y="71.900" class="ts" text-anchor="start">1. All dimensions in cm, finished (net) sizes as measured</text>
<text x="288.000" y="75.800" class="ts" text-anchor="start">   on the cardboard prototype. No seam allowance included:</text>
<text x="288.000" y="79.700" class="ts" text-anchor="start">   add 0.8 for turned seams, 0 for bound / edge-painted</text>
<text x="288.000" y="83.600" class="ts" text-anchor="start">   edges (reference shows edge-stitched, turned edges).</text>
<text x="288.000" y="87.500" class="ts" text-anchor="start">2. Drawn with the OUTER face up (strap, buckle, logo side).</text>
<text x="288.000" y="91.400" class="ts" text-anchor="start">   Pattern assumed symmetrical about its vertical centre</text>
<text x="288.000" y="95.300" class="ts" text-anchor="start">   line; left side measured equal to the right (5.7 / 8.0).</text>
<text x="288.000" y="99.200" class="ts" text-anchor="start">   The top flap folds over the top and down the front, so</text>
<text x="288.000" y="103.100" class="ts" text-anchor="start">   its buckle, keeper and logo are drawn rotated 180 deg and</text>
<text x="288.000" y="107.000" class="ts" text-anchor="start">   dimensioned from the fold line (= top of the closed case).</text>
<text x="288.000" y="110.900" class="ts" text-anchor="start">3. Construction: trifold clutch (reference photos). Side</text>
<text x="288.000" y="114.800" class="ts" text-anchor="start">   flaps fold in and tuck inside, front panel folds up over</text>
<text x="288.000" y="118.700" class="ts" text-anchor="start">   them and snaps to the side flaps, top flap folds down,</text>
<text x="288.000" y="122.600" class="ts" text-anchor="start">   strap tongue snaps to the front panel.</text>
<text x="288.000" y="126.500" class="ts" text-anchor="start">   Pages 1-3 are sewn into the bottom gusset; the back</text>
<text x="288.000" y="130.400" class="ts" text-anchor="start">   wall lining is storage panel 4 (sheet 7).</text>
<text x="288.000" y="134.300" class="ts" text-anchor="start">4. Gusset depths as measured: 5.7 (sides), 6.0 (bottom),</text>
<text x="288.000" y="138.200" class="ts" text-anchor="start">   6.5 (top). Keep as measured (Q1, sheet 3).</text>
<text x="288.000" y="142.100" class="ts" text-anchor="start">5. Strap: stitched to the back wall, top gusset and top</text>
<text x="288.000" y="146.000" class="ts" text-anchor="start">   flap; 30 mm buckle and keeper on the flap are visual</text>
<text x="288.000" y="149.900" class="ts" text-anchor="start">   only. The tongue (3.0 beyond the flap) snaps to a stud</text>
<text x="288.000" y="153.800" class="ts" text-anchor="start">   on the front panel 11.0 below the top. Side-flap snaps:</text>
<text x="288.000" y="157.700" class="ts" text-anchor="start">   12.5 mm, studs outer face, sockets front-panel inner</text>
<text x="288.000" y="161.600" class="ts" text-anchor="start">   face - they hold the front panel to the side flaps.</text>
<text x="288.000" y="165.500" class="ts" text-anchor="start">6. Outer: full-grain leather 1.2-1.4 mm (or PU 1.0-1.2),</text>
<text x="288.000" y="169.400" class="ts" text-anchor="start">   tan; strap dark brown. Board 1.0 mm in back wall and</text>
<text x="288.000" y="173.300" class="ts" text-anchor="start">   front panel; lining 0.6 mm, same tan (reference).</text>
<text x="288.000" y="177.200" class="ts" text-anchor="start">7. Top flap 10.0 as in the reference photos (client,</text>
<text x="288.000" y="181.100" class="ts" text-anchor="start">   2026-10-01); the prototype measured 5.0 - superseded.</text>

<text x="258.000" y="81.400" class="tb" text-anchor="start">PANEL CONSTRUCTION (all four storage surfaces)</text>
<text x="258.000" y="85.100" class="ts" text-anchor="start">1. Face ply 1.0 mm leather with the slits die-cut, over</text>
<text x="258.000" y="88.800" class="ts" text-anchor="start">   0.8 mm board and a 0.6 mm back ply; edge-stitched 0.3</text>
<text x="258.000" y="92.500" class="ts" text-anchor="start">   in contrast thread. Pages: R 1.0 top corners.</text>
<text x="258.000" y="96.200" class="ts" text-anchor="start">2. Elastic: 15 mm knit elastic, matching colour, threaded</text>
<text x="258.000" y="99.900" class="ts" text-anchor="start">   IN and OUT of the face ply through 1.6 slits so each</text>
<text x="258.000" y="103.600" class="ts" text-anchor="start">   pair sits in its own visible loop and the elastic runs</text>
<text x="258.000" y="107.300" class="ts" text-anchor="start">   hidden behind the face between loops (reference photos).</text>
<text x="258.000" y="111.000" class="ts" text-anchor="start">3. Loop (slot) widths are the prototype's: 0.6 for 2.0 mm,</text>

<text x="258.000" y="122.100" class="ts" text-anchor="start">4. Thread the elastic before laminating the face to the</text>
<text x="258.000" y="125.800" class="ts" text-anchor="start">   board. Bar-tack 1.5 at every slit; stitch the two ends</text>
<text x="258.000" y="129.500" class="ts" text-anchor="start">   down under a 1.0 anchor. Elastic cut = slit field + 2.</text>

<text x="258.000" y="140.600" class="ts" text-anchor="start">6. Tip points up; 1.5 clear above the points (prototype).</text>

<text x="258.000" y="60.400" class="tb" text-anchor="start">PANEL 2 LAYOUT (reference photo R5)</text>
<text x="258.000" y="64.100" class="ts" text-anchor="start">- Two small patch pockets at the left, stacked, as large</text>
<text x="258.000" y="67.800" class="ts" text-anchor="start">  as the page allows beside the 15.0 needle zone: body</text>
<text x="258.000" y="71.500" class="ts" text-anchor="start">  3.9 x 4.1, flap 3.9 x 1.6 with a 10 mm brass snap,</text>
<text x="258.000" y="75.200" class="ts" text-anchor="start">  edge-stitched. Body cut 3.9 x 4.6 (0.5 under the flap).</text>
<text x="258.000" y="78.900" class="ts" text-anchor="start">  Pocket A: 6 end caps + 4 keys. Pocket B: 3 connectors</text>
<text x="258.000" y="82.600" class="ts" text-anchor="start">  + the folded leather grip patch (6.0 x 3.0, folds to 3.0).</text>
<text x="258.000" y="86.300" class="ts" text-anchor="start">- Needle zone 15.0 wide: 6 pairs 5.5-10 mm, loop widths</text>
<text x="258.000" y="90.000" class="ts" text-anchor="start">  1.7-2.2, slit field 14.2 centred (0.4 margins).</text>
<text x="258.000" y="93.700" class="ts" text-anchor="start">- The 10 mm pair is the thickest item in the case (1.0).</text>
<text x="258.000" y="97.400" class="ts" text-anchor="start"></text>
<text x="258.000" y="101.100" class="tb" text-anchor="start">PANEL CONSTRUCTION (all four storage surfaces)</text>
<text x="258.000" y="104.800" class="ts" text-anchor="start">1. Face ply 1.0 mm leather with the slits die-cut, over</text>
<text x="258.000" y="108.500" class="ts" text-anchor="start">   0.8 mm board and a 0.6 mm back ply; edge-stitched 0.3</text>
<text x="258.000" y="112.200" class="ts" text-anchor="start">   in contrast thread. Pages: R 1.0 top corners.</text>
<text x="258.000" y="115.900" class="ts" text-anchor="start">2. Elastic: 15 mm knit elastic, matching colour, threaded</text>
<text x="258.000" y="119.600" class="ts" text-anchor="start">   IN and OUT of the face ply through 1.6 slits so each</text>
<text x="258.000" y="123.300" class="ts" text-anchor="start">   pair sits in its own visible loop and the elastic runs</text>
<text x="258.000" y="127.000" class="ts" text-anchor="start">   hidden behind the face between loops (reference photos).</text>
<text x="258.000" y="130.700" class="ts" text-anchor="start">3. Loop (slot) widths are the prototype's: 0.6 for 2.0 mm,</text>
<text x="258.000" y="134.400" class="ts" text-anchor="start">   +0.1 per size step, to 2.2 for 10 mm. 0.5 hidden run</text>
<text x="258.000" y="138.100" class="ts" text-anchor="start">   between loops. One loop holds one PAIR, side by side.</text>
<text x="258.000" y="141.800" class="ts" text-anchor="start">4. Thread the elastic before laminating the face to the</text>
<text x="258.000" y="145.500" class="ts" text-anchor="start">   board. Bar-tack 1.5 at every slit; stitch the two ends</text>
<text x="258.000" y="149.200" class="ts" text-anchor="start">   down under a 1.0 anchor. Elastic cut = slit field + 2.</text>
<text x="258.000" y="152.900" class="ts" text-anchor="start">5. Size labels heat-stamped / printed above each loop</text>
<text x="258.000" y="156.600" class="ts" text-anchor="start">   with a 0.5 leader line to the tip (reference photo).</text>
<text x="258.000" y="160.300" class="ts" text-anchor="start">6. Tip points up; 1.5 clear above the points (prototype).</text>

<text x="258.000" y="81.400" class="tb" text-anchor="start">PANEL CONSTRUCTION (all four storage surfaces)</text>
<text x="258.000" y="85.100" class="ts" text-anchor="start">1. Face ply 1.0 mm leather with the slits die-cut, over</text>
<text x="258.000" y="88.800" class="ts" text-anchor="start">   0.8 mm board and a 0.6 mm back ply; edge-stitched 0.3</text>
<text x="258.000" y="92.500" class="ts" text-anchor="start">   in contrast thread. Pages: R 1.0 top corners.</text>
<text x="258.000" y="96.200" class="ts" text-anchor="start">2. Elastic: 15 mm knit elastic, matching colour, threaded</text>
<text x="258.000" y="99.900" class="ts" text-anchor="start">   IN and OUT of the face ply through 1.6 slits so each</text>
<text x="258.000" y="103.600" class="ts" text-anchor="start">   pair sits in its own visible loop and the elastic runs</text>
<text x="258.000" y="107.300" class="ts" text-anchor="start">   hidden behind the face between loops (reference photos).</text>
<text x="258.000" y="111.000" class="ts" text-anchor="start">3. Loop (slot) widths are the prototype's: 0.6 for 2.0 mm,</text>
<text x="258.000" y="114.700" class="ts" text-anchor="start">   +0.1 per size step, to 2.2 for 10 mm. 0.5 hidden run</text>
<text x="258.000" y="118.400" class="ts" text-anchor="start">   between loops. One loop holds one PAIR, side by side.</text>
<text x="258.000" y="122.100" class="ts" text-anchor="start">4. Thread the elastic before laminating the face to the</text>
<text x="258.000" y="125.800" class="ts" text-anchor="start">   board. Bar-tack 1.5 at every slit; stitch the two ends</text>
<text x="258.000" y="129.500" class="ts" text-anchor="start">   down under a 1.0 anchor. Elastic cut = slit field + 2.</text>
<text x="258.000" y="133.200" class="ts" text-anchor="start">5. Size labels heat-stamped / printed above each loop</text>
<text x="258.000" y="136.900" class="ts" text-anchor="start">   with a 0.5 leader line to the tip (reference photo).</text>
<text x="258.000" y="140.600" class="ts" text-anchor="start">6. Tip points up; 1.5 clear above the points (prototype).</text>
<text x="258.000" y="148.300" class="tb" text-anchor="start">PANEL 3 NOTE</text>
<text x="258.000" y="152.000" class="ts" text-anchor="start">- Same loop widths and slit positions as panel 1, so</text>
<text x="258.000" y="155.700" class="ts" text-anchor="start">  the two pages share one slit-cutting template.</text>
<text x="258.000" y="159.400" class="ts" text-anchor="start">- 5 cm tips sit centred on the page (reference photo):</text>
<text x="258.000" y="163.100" class="ts" text-anchor="start">  points 3.75 from the top, elastic centred at 6.25.</text>

<text x="258.000" y="52.000" class="tb" text-anchor="start">PANEL 4 - BACK WALL (reference photo R6)</text>
<text x="258.000" y="55.700" class="ts" text-anchor="start">- This is the lining ply of the back wall, 21.0 x 13.0:</text>
<text x="258.000" y="59.400" class="ts" text-anchor="start">  the loops and the pocket are made on it BEFORE it is</text>
<text x="258.000" y="63.100" class="ts" text-anchor="start">  laminated to the board and outer shell, so the hidden</text>
<text x="258.000" y="66.800" class="ts" text-anchor="start">  elastic runs lie between lining and board.</text>
<text x="258.000" y="70.500" class="ts" text-anchor="start">- Cable pocket at the left, as large as the wall allows</text>
<text x="258.000" y="74.200" class="ts" text-anchor="start">  beside the needle zone: patch pocket 9.7 x 9.0 with a</text>
<text x="258.000" y="77.900" class="ts" text-anchor="start">  3.0 flap and 12.5 mm brass snap. Body cut 9.7 x 9.5.</text>
<text x="258.000" y="81.600" class="ts" text-anchor="start">  Holds the 5 cables, each coiled to 6.5 cm or less.</text>
<text x="258.000" y="85.300" class="ts" text-anchor="start">- Needle zone 10.2 wide: 4 pairs 5.5 / 6 / 7 / 8 mm, loop</text>
<text x="258.000" y="89.000" class="ts" text-anchor="start">  widths 1.7-2.0, slit field 8.9 centred (0.65 margins).</text>
<text x="258.000" y="92.700" class="ts" text-anchor="start">- 5 cm tips: points 4.0 from the top, elastic centred at</text>
<text x="258.000" y="96.400" class="ts" text-anchor="start">  6.5 (level with panels 1-2).</text>
<text x="258.000" y="100.100" class="ts" text-anchor="start"></text>
<text x="258.000" y="103.800" class="tb" text-anchor="start">PANEL CONSTRUCTION (all four storage surfaces)</text>
<text x="258.000" y="107.500" class="ts" text-anchor="start">1. Face ply 1.0 mm leather with the slits die-cut, over</text>
<text x="258.000" y="111.200" class="ts" text-anchor="start">   0.8 mm board and a 0.6 mm back ply; edge-stitched 0.3</text>
<text x="258.000" y="114.900" class="ts" text-anchor="start">   in contrast thread. Pages: R 1.0 top corners.</text>
<text x="258.000" y="118.600" class="ts" text-anchor="start">2. Elastic: 15 mm knit elastic, matching colour, threaded</text>
<text x="258.000" y="122.300" class="ts" text-anchor="start">   IN and OUT of the face ply through 1.6 slits so each</text>
<text x="258.000" y="126.000" class="ts" text-anchor="start">   pair sits in its own visible loop and the elastic runs</text>
<text x="258.000" y="129.700" class="ts" text-anchor="start">   hidden behind the face between loops (reference photos).</text>
<text x="258.000" y="133.400" class="ts" text-anchor="start">3. Loop (slot) widths are the prototype's: 0.6 for 2.0 mm,</text>
<text x="258.000" y="137.100" class="ts" text-anchor="start">   +0.1 per size step, to 2.2 for 10 mm. 0.5 hidden run</text>
<text x="258.000" y="140.800" class="ts" text-anchor="start">   between loops. One loop holds one PAIR, side by side.</text>
<text x="258.000" y="144.500" class="ts" text-anchor="start">4. Thread the elastic before laminating the face to the</text>
<text x="258.000" y="148.200" class="ts" text-anchor="start">   board. Bar-tack 1.5 at every slit; stitch the two ends</text>
<text x="258.000" y="151.900" class="ts" text-anchor="start">   down under a 1.0 anchor. Elastic cut = slit field + 2.</text>
<text x="258.000" y="155.600" class="ts" text-anchor="start">5. Size labels heat-stamped / printed above each loop</text>
<text x="258.000" y="159.300" class="ts" text-anchor="start">   with a 0.5 leader line to the tip (reference photo).</text>
<text x="258.000" y="163.000" class="ts" text-anchor="start">6. Tip points up; 1.5 clear above the points (prototype).</text>

<text x="150.000" y="105.000" class="tb" text-anchor="start">CONSTRUCTION SEQUENCE</text>
<text x="150.000" y="108.800" class="ts" text-anchor="start">1. Cut shell, lining, board, pages and pockets (sheets 2, 4-8). Die-cut the elastic slits in the three page face plies and in the</text>
<text x="150.000" y="112.600" class="ts" text-anchor="start">   back-wall lining (sheets 4-7 at 1:1). Emboss the logo on the top flap while flat.</text>
<text x="150.000" y="116.400" class="ts" text-anchor="start">2. Make the pockets on the face plies (panel 2: A, B; back-wall lining: cable pocket). Set the pocket snaps.</text>
<text x="150.000" y="120.200" class="ts" text-anchor="start">3. Thread the elastics in and out of the slits, loop by loop; bar-tack each slit, stitch the ends down. Print / stamp the size labels.</text>
<text x="150.000" y="124.000" class="ts" text-anchor="start">4. Laminate each page: face ply + 0.8 board + back ply; edge-stitch 0.3, leaving the 1.5 hinge tab single-ply.</text>
<text x="150.000" y="127.800" class="ts" text-anchor="start">5. Stitch the strap to the outer shell (back wall + top gusset + top flap) with the buckle piece and keeper on the flap section.</text>
<text x="150.000" y="131.600" class="ts" text-anchor="start">6. Set the side-flap studs and the front-panel sockets. Laminate lining to shell with board in the back wall and front panel.</text>
<text x="150.000" y="135.400" class="ts" text-anchor="start">7. Stitch the page hinge tabs through the bottom gusset in order P3, P2, P1 (sheet 8, detail C). Turn / bind all edges; edge-stitch 0.3.</text>
<text x="150.000" y="139.200" class="ts" text-anchor="start">8. Dry-fold; set the strap stud on the front panel and the socket in the tongue; check all snaps. Load the set; the closed case must not press on the 10 mm tips.</text>
<text x="150.000" y="143.000" class="ts" text-anchor="start"></text>
<text x="150.000" y="146.800" class="tb" text-anchor="start">TOLERANCES</text>
<text x="150.000" y="150.600" class="ts" text-anchor="start">Cut pieces +/- 0.1 cm; slit positions +/- 0.05 cm (the 0.6 loop must still take two 2 mm tips); snap centres +/- 0.15 cm; hinge seams +/- 0.1 cm.</text>
