<text x="288.000" y="68.000" class="tb" text-anchor="start">NOTES</text>
<text x="288.000" y="71.900" class="ts" text-anchor="start">1. All dimensions in cm, finished (net) sizes as measured</text>
<text x="288.000" y="75.800" class="ts" text-anchor="start">   on the cardboard prototype. No seam allowance included:</text>
<text x="288.000" y="79.700" class="ts" text-anchor="start">   add 0.8 cm for turned seams, 0 for bound / edge-painted</text>
<text x="288.000" y="83.600" class="ts" text-anchor="start">   edges, or 1.0 cm wrap allowance if covering board.</text>
<text x="288.000" y="87.500" class="ts" text-anchor="start">2. Pattern assumed symmetrical about its vertical centre</text>
<text x="288.000" y="91.400" class="ts" text-anchor="start">   line. Left side wall / end flap not dimensioned on the</text>
<text x="288.000" y="95.300" class="ts" text-anchor="start">   prototype; drawn equal to the right side (5.7 / 8.0).</text>
<text x="288.000" y="99.200" class="ts" text-anchor="start">3. Wall heights are as measured: 5.7 (sides), 6.0 (front),</text>
<text x="288.000" y="103.100" class="ts" text-anchor="start">   6.5 (rear). For a square-cornered box equalise all four</text>
<text x="288.000" y="107.000" class="ts" text-anchor="start">   to 6.0 before cutting - see sheet 2, open question Q1.</text>
<text x="288.000" y="110.900" class="ts" text-anchor="start">4. Base 13.0 vs lid 12.7: the 0.3 cm difference lets the</text>
<text x="288.000" y="114.800" class="ts" text-anchor="start">   lid clear the rear flap when closed. Keep as measured.</text>
<text x="288.000" y="118.700" class="ts" text-anchor="start">5. Snaps: 12.5 mm (line 20) spring snaps, 2 sets on the</text>
<text x="288.000" y="122.600" class="ts" text-anchor="start">   end flaps + 2 sets on panel B keeper flap (sheet 4).</text>
<text x="288.000" y="126.500" class="ts" text-anchor="start">   Set snap studs on the lid after a dry fold of the first</text>
<text x="288.000" y="130.400" class="ts" text-anchor="start">   sample; the fold radius shifts them ~1 material thickness.</text>
<text x="288.000" y="134.300" class="ts" text-anchor="start">6. Outer: faux leather (PU) 1.0-1.2 mm. Stiffen base, lid</text>
<text x="288.000" y="138.200" class="ts" text-anchor="start">   and walls with 1.5 mm greyboard (optional for flaps).</text>

<text x="258.000" y="81.400" class="tb" text-anchor="start">CONSTRUCTION NOTES</text>
<text x="258.000" y="85.100" class="ts" text-anchor="start">1. Slot widths (w) are finished inside widths, taken</text>
<text x="258.000" y="88.800" class="ts" text-anchor="start">   straight from the prototype: 0.6 cm for 2.0 mm,</text>
<text x="258.000" y="92.500" class="ts" text-anchor="start">   +0.1 cm per size step, to 2.2 cm for 10 mm. Each</text>
<text x="258.000" y="96.200" class="ts" text-anchor="start">   slot holds one PAIR, the two tips side by side.</text>
<text x="258.000" y="99.900" class="ts" text-anchor="start">2. Band: 25 mm knit elastic (drawn) stitched flat to</text>
<text x="258.000" y="103.600" class="ts" text-anchor="start">   the panel on every stitch line; no ease needed.</text>
<text x="258.000" y="107.300" class="ts" text-anchor="start">   If a faux-leather strip is used instead, add ease</text>
<text x="258.000" y="111.000" class="ts" text-anchor="start">   of 2 x tip diameter to the strip length per slot.</text>
<text x="258.000" y="114.700" class="ts" text-anchor="start">3. Stitch lines in pairs 0.5 cm apart (the 'land');</text>
<text x="258.000" y="118.400" class="ts" text-anchor="start">   single line at the strip ends. Stitch 3 mm, 2 passes.</text>
<text x="258.000" y="122.100" class="ts" text-anchor="start">4. Panel = 1.5 mm greyboard wrapped in lining faux</text>
<text x="258.000" y="125.800" class="ts" text-anchor="start">   leather; finished 20.5 x 12.5 to drop into the</text>
<text x="258.000" y="129.500" class="ts" text-anchor="start">   21.0 x 13.0 interior. Glue + edge-stitch in place.</text>
<text x="258.000" y="133.200" class="ts" text-anchor="start">5. Size labels heat-stamped / printed on the band</text>
<text x="258.000" y="136.900" class="ts" text-anchor="start">   at each slot (shown on drawing). Order: smallest</text>
<text x="258.000" y="140.600" class="ts" text-anchor="start">   size nearest the edge shown, as on the prototype.</text>
<text x="258.000" y="144.300" class="ts" text-anchor="start">6. Tip points toward the top edge of the drawing;</text>
<text x="258.000" y="148.000" class="ts" text-anchor="start">   1.5 cm clear above the points (prototype).</text>

<text x="258.000" y="130.000" class="tb" text-anchor="start">KEEPER FLAP (from prototype photos 2 and 4)</text>
<text x="258.000" y="133.700" class="ts" text-anchor="start">- The lid hangs open when the case is used, so the</text>
<text x="258.000" y="137.400" class="ts" text-anchor="start">  large tips need a flap: 9.0 deep (photo 2), two</text>
<text x="258.000" y="141.100" class="ts" text-anchor="start">  snaps (photo 4), hinged on the tip edge of panel B.</text>
<text x="258.000" y="144.800" class="ts" text-anchor="start">- Snaps sit in the 3.15 margins either side of the slot</text>
<text x="258.000" y="148.500" class="ts" text-anchor="start">  strip, 8.0 from the hinge and 1.6 from the side</text>
<text x="258.000" y="152.200" class="ts" text-anchor="start">  edges, so the studs on the panel clear the needles.</text>
<text x="258.000" y="155.900" class="ts" text-anchor="start">  Studs go through panel board + lining; back each</text>
<text x="258.000" y="159.600" class="ts" text-anchor="start">  with a 2 x 2 cm leather patch.</text>
<text x="258.000" y="163.300" class="ts" text-anchor="start">- Flap covers 9.0 of the 12.5 panel: the tip points</text>
<text x="258.000" y="167.000" class="ts" text-anchor="start">  (1.5-6.5 from the hinge) are fully covered.</text>
<text x="258.000" y="170.700" class="ts" text-anchor="start">- Check snap engagement after a dry fold; move the</text>
<text x="258.000" y="174.400" class="ts" text-anchor="start">  caps 0.1-0.2 toward the hinge if the flap pulls tight.</text>

<text x="258.000" y="81.400" class="tb" text-anchor="start">PAGE (both faces) - proposal, not in prototype</text>
<text x="258.000" y="85.100" class="ts" text-anchor="start">- One double-sided page carries all 5 cm tips plus the</text>
<text x="258.000" y="88.800" class="ts" text-anchor="start">  small hardware, so the 10 cm panels stay uncluttered.</text>
<text x="258.000" y="92.500" class="ts" text-anchor="start">  Core 1.5 mm board, lined both faces, 20.5 x 12.5.</text>
<text x="258.000" y="96.200" class="ts" text-anchor="start">- Hinge: 1.5 cm faux-leather strip along the bottom</text>
<text x="258.000" y="99.900" class="ts" text-anchor="start">  edge, stitched to the front-wall inner face. The page</text>
<text x="258.000" y="103.600" class="ts" text-anchor="start">  lies on panel A when closed and flips onto the lid</text>
<text x="258.000" y="107.300" class="ts" text-anchor="start">  when the case is opened (sheet 2).</text>
<text x="258.000" y="111.000" class="ts" text-anchor="start">- Face 1 (this sheet): 5 cm tips 2.0-5.0 mm in the same</text>
<text x="258.000" y="114.700" class="ts" text-anchor="start">  slot widths and positions as panel A, band 2.0 wide</text>
<text x="258.000" y="118.400" class="ts" text-anchor="start">  (narrower for the short tips). Below: 2.5 cm elastic</text>
<text x="258.000" y="122.100" class="ts" text-anchor="start">  with 6 loops for the screw-on end caps (1.6 wide)</text>
<text x="258.000" y="125.800" class="ts" text-anchor="start">  and 4 loops for the cable keys (1.4 wide).</text>
<text x="258.000" y="129.500" class="ts" text-anchor="start">- Loop sizes assume caps &lt;= 1.0 dia x 1.5 long and keys</text>
<text x="258.000" y="133.200" class="ts" text-anchor="start">  &lt;= 1.2 x 3.5. Measure the real hardware (Q6, sheet 2).</text>
<text x="258.000" y="136.900" class="ts" text-anchor="start"></text>
<text x="258.000" y="140.600" class="tb" text-anchor="start">CONSTRUCTION NOTES</text>
<text x="258.000" y="144.300" class="ts" text-anchor="start">1. Slot widths (w) are finished inside widths, taken</text>
<text x="258.000" y="148.000" class="ts" text-anchor="start">   straight from the prototype: 0.6 cm for 2.0 mm,</text>
<text x="258.000" y="151.700" class="ts" text-anchor="start">   +0.1 cm per size step, to 2.2 cm for 10 mm. Each</text>
<text x="258.000" y="155.400" class="ts" text-anchor="start">   slot holds one PAIR, the two tips side by side.</text>
<text x="258.000" y="159.100" class="ts" text-anchor="start">2. Band: 25 mm knit elastic (drawn) stitched flat to</text>
<text x="258.000" y="162.800" class="ts" text-anchor="start">   the panel on every stitch line; no ease needed.</text>
<text x="258.000" y="166.500" class="ts" text-anchor="start">   If a faux-leather strip is used instead, add ease</text>

<text x="150.000" y="105.000" class="tb" text-anchor="start">CONSTRUCTION SEQUENCE</text>
<text x="150.000" y="108.800" class="ts" text-anchor="start">1. Cut outer shell and lining from sheet 1 (net + allowance). Score fold lines on the board side.</text>
<text x="150.000" y="112.600" class="ts" text-anchor="start">2. Make the three interior panels first (sheets 3-6): wrap board in lining, stitch bands / loops / pockets</text>
<text x="150.000" y="116.400" class="ts" text-anchor="start">   through the lining BEFORE wrapping so no stitching shows on the back. Set panel B studs.</text>
<text x="150.000" y="120.200" class="ts" text-anchor="start">3. Set end-flap snap caps on the outer shell while flat. Studs on the lid outer face: mark from a dry fold.</text>
<text x="150.000" y="124.000" class="ts" text-anchor="start">4. Laminate board to the outer shell (base, lid, walls); turn / bind all edges; top-stitch at 0.3 cm.</text>
<text x="150.000" y="127.800" class="ts" text-anchor="start">5. Form the box: fold the walls, glue corner tabs or stitch the corners (box-stitch) outside-in.</text>
<text x="150.000" y="131.600" class="ts" text-anchor="start">6. Glue + edge-stitch panel A into the base, panel B into the lid; stitch the page hinge to the front wall.</text>
<text x="150.000" y="135.400" class="ts" text-anchor="start">7. Stitch the keeper flap to the tip edge of panel B. Check all 4 snaps engage cleanly.</text>
<text x="150.000" y="139.200" class="ts" text-anchor="start">8. Load the set in the order of the contents checklist and check the stack height closes without pressure.</text>
<text x="150.000" y="143.000" class="ts" text-anchor="start"></text>
<text x="150.000" y="146.800" class="tb" text-anchor="start">TOLERANCES</text>
<text x="150.000" y="150.600" class="ts" text-anchor="start">Cut pieces +/- 0.1 cm; slot stitch lines +/- 0.05 cm (the 0.6 slot must still take two 2 mm tips); snap centres +/- 0.15 cm.</text>
<text x="150.000" y="154.400" class="ts" text-anchor="start">Interior panels are 0.5 cm smaller than the box interior in both directions to allow for lining thickness.</text>
