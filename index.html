<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ziq Mac — Photography</title>
<meta name="description" content="Portfolio of Ziq Mac, photographer. Portraits, landscapes and editorial work.">
<link rel="canonical" href="https://example.com/">
<link rel="preload" as="image" href="assets/home.svg">

<style>
  :root {
    --paper: #faf8f5;
    --backdrop: #0d1017;

    /* Aspect ratio of the homepage image (width / height). The scene is
       1600x1000, so 1.6. Change this if you swap in a photo of a different
       shape — the hotspots are positioned against this box, so they stay
       glued to the picture at every viewport size. */
    --ar: 1.6;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--backdrop);
    color: var(--paper);
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  /* The stage fills the viewport and crops the overflow; the frame inside it
     keeps the image's exact aspect ratio. Sizing the frame to cover — rather
     than using object-fit on the <img> — is what lets percentage-positioned
     hotspots track the picture, because they share the frame's coordinate
     space no matter which axis is doing the cropping. */
  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  /* Centred with position + transform rather than grid or flex centring: when
     the frame is larger than the viewport — which is the whole point of a
     cover crop — a centred grid item gets pinned to the start edge instead of
     overflowing evenly, and the crop then eats the bottom of the picture
     rather than a strip off each side. */
  .frame {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    aspect-ratio: var(--ar);
    width: max(100vw, calc(100vh * var(--ar)));
    width: max(100svw, calc(100svh * var(--ar)));
  }

  .photo {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* --- Navigation ------------------------------------------------------
     One list of real links, laid out two ways: as hotspots over the picture
     on a large screen, as a bar along the bottom on a small one. Same markup
     either way, so keyboard and screen-reader users get the same nav as
     everyone else and there are no duplicate links to tab through. */

  .nav ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .nav li {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--w);
    height: var(--h);
  }

  .nav a {
    position: absolute;
    inset: 0;
    display: grid;
    align-content: end;
    justify-items: center;
    gap: 8px;
    padding-bottom: 6px;
    color: var(--paper);
    text-decoration: none;
    border-radius: 10px;
  }

  /* The dot is the affordance: without it nothing on a photograph looks
     clickable. It sits at the bottom edge of the hotspot so it reads as a
     marker pinned to the thing behind it. */
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--paper);
    box-shadow: 0 0 0 4px rgb(250 248 245 / .25), 0 2px 10px rgb(0 0 0 / .5);
    transition: transform .18s ease, box-shadow .18s ease;
  }

  .label {
    font-size: .8rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 999px;
    background: rgb(13 16 23 / .68);
    backdrop-filter: blur(6px);
    white-space: nowrap;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .18s ease, transform .18s ease;
  }

  .nav a:hover .label,
  .nav a:focus-visible .label { opacity: 1; transform: none; }

  .nav a:hover .dot,
  .nav a:focus-visible .dot {
    transform: scale(1.45);
    box-shadow: 0 0 0 8px rgb(250 248 245 / .2), 0 2px 14px rgb(0 0 0 / .55);
  }

  .nav a:focus-visible {
    outline: 2px solid var(--paper);
    outline-offset: 4px;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px rgb(250 248 245 / .25), 0 2px 10px rgb(0 0 0 / .5); }
    50%      { box-shadow: 0 0 0 11px rgb(250 248 245 / 0), 0 2px 10px rgb(0 0 0 / .5); }
  }

  /* A slow pulse, staggered per marker, says "these are live" on first
     landing. Stops on interaction so it never competes with the hover state. */
  .nav a:not(:hover):not(:focus-visible) .dot { animation: pulse 3.2s ease-in-out infinite; }
  .nav li:nth-child(2) .dot { animation-delay: .5s; }
  .nav li:nth-child(3) .dot { animation-delay: 1s; }

  /* Anchored to the stage, not the frame: the frame is the part that gets
     cropped, so a wordmark inside it walks off the screen the moment the
     viewport is narrower than the picture. */
  .wordmark {
    position: absolute;
    top: clamp(20px, 4vh, 44px);
    left: clamp(20px, 4vw, 56px);
    z-index: 2;
  }

  .wordmark h1 {
    margin: 0;
    font-size: clamp(1.5rem, 3.4vw, 2.6rem);
    letter-spacing: -0.01em;
    text-shadow: 0 2px 18px rgb(0 0 0 / .6);
  }

  .wordmark p {
    margin: .35em 0 0;
    font-size: .82rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    opacity: .78;
    text-shadow: 0 2px 12px rgb(0 0 0 / .7);
  }

  /* Touch devices have no hover, so the labels have to be there from the
     start or the hotspots are a guessing game. */
  @media (hover: none) {
    .label { opacity: 1; transform: none; }
  }

  /* When the viewport is narrower than the picture, covering the screen crops
     the sides off — and a hotspot you cannot see is not navigation. The
     leftmost hotspot starts at 11.2%, which survives the crop down to a
     viewport ratio of about 1.24; below that, and on any small screen, the
     same links become an ordinary bar.

     If you swap in an image with a different --ar, or move a hotspot closer to
     an edge, recompute this breakpoint — see README. */
  @media (max-width: 720px), (max-aspect-ratio: 5 / 4) {
    .nav {
      position: fixed;
      inset: auto 0 0 0;
      z-index: 2;
      background: linear-gradient(to top, rgb(13 16 23 / .92), rgb(13 16 23 / 0));
      padding: 48px 16px 20px;
    }
    .nav ul {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .nav li { position: static; width: auto; height: auto; }
    .nav a { position: static; padding: 0; }
    .dot { display: none; }
    .label { opacity: 1; transform: none; font-size: .78rem; padding: 9px 16px; }

    /* The hint is about the hotspots. In bar layout there are none to hint at. */
    .wordmark p { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dot, .label, .nav a .dot { animation: none; transition: none; }
  }

  /* Turned on by adding ?edit to the URL — see README. */
  .editing .nav li { outline: 1px dashed rgb(250 248 245 / .8); }
  .editing .label { opacity: 1; transform: none; }
  .readout {
    position: fixed;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    z-index: 3;
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: rgb(13 16 23 / .9);
    padding: 8px 14px;
    border-radius: 8px;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="frame">

    <img class="photo" src="assets/home.svg" width="1600" height="1000"
         fetchpriority="high" decoding="async"
         alt="A cabin, a signpost and a mailbox on a hillside at dusk.">

    <nav class="nav" aria-label="Main">
      <ul>
        <li style="--x:11.2%; --y:38.5%; --w:14.4%; --h:26%">
          <a href="about.html"><span class="dot"></span><span class="label">About</span></a>
        </li>
        <li style="--x:42%; --y:38%; --w:13.8%; --h:26.5%">
          <a href="work.html"><span class="dot"></span><span class="label">Work</span></a>
        </li>
        <li style="--x:71.2%; --y:50%; --w:8%; --h:15%">
          <a href="contact.html"><span class="dot"></span><span class="label">Contact</span></a>
        </li>
      </ul>
    </nav>

  </div>

  <div class="wordmark">
    <h1>Ziq Mac</h1>
    <p>Everything in the scene is a link</p>
  </div>

</div>

<script>
/* Hotspot placement helper. Load the page with ?edit to outline the hotspots
   and read out the coordinates of wherever you click, as percentages of the
   image — paste those straight into the --x / --y variables above. Does
   nothing at all on the normal URL. */
(function () {
  if (!/(^|[?&])edit(=|&|$)/.test(location.search)) return;

  var frame = document.querySelector('.frame');
  document.body.classList.add('editing');

  var readout = document.createElement('div');
  readout.className = 'readout';
  readout.textContent = 'edit mode — click the picture to read coordinates';
  document.body.appendChild(readout);

  frame.addEventListener('click', function (e) {
    e.preventDefault();
    var box = frame.getBoundingClientRect();
    var x = ((e.clientX - box.left) / box.width) * 100;
    var y = ((e.clientY - box.top) / box.height) * 100;
    var text = '--x:' + x.toFixed(1) + '%; --y:' + y.toFixed(1) + '%';
    readout.textContent = text;
    if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function () {});
  });
})();
</script>

</body>
</html>
