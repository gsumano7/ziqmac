<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Placeholder homepage image. Swap for a real photo of the same 16:10
       aspect ratio, or update the ratio variable in index.html to match. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#151d33"/>
      <stop offset=".45" stop-color="#3c4c72"/>
      <stop offset=".78" stop-color="#c9764f"/>
      <stop offset="1"   stop-color="#f0b070"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2130"/>
      <stop offset="1" stop-color="#0d1017"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffca7a" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffca7a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1180" cy="250" r="240" fill="url(#glow)"/>
  <circle cx="1180" cy="250" r="72" fill="#ffdfae"/>

  <path d="M0 470 L210 372 L360 440 L520 336 L700 452 L880 370 L1060 460 L1250 392 L1420 470 L1600 420 L1600 660 L0 660 Z"
        fill="#2b3550" opacity=".85"/>
  <!-- near ridge -->
  <path d="M0 560 L180 500 L330 552 L520 470 L740 566 L960 496 L1180 570 L1400 512 L1600 566 L1600 700 L0 700 Z"
        fill="#1c2436"/>

  <rect y="640" width="1600" height="360" fill="url(#ground)"/>

  <!-- path leading to the horizon -->
  <path d="M742 640 L858 640 L1010 1000 L560 1000 Z" fill="#242c3d" opacity=".75"/>

  <!-- cabin (About) -->
  <g>
    <path d="M180 470 L295 392 L410 470 Z" fill="#0e1219"/>
    <rect x="205" y="470" width="180" height="172" fill="#121722"/>
    <rect x="243" y="512" width="52" height="48" fill="#ffca7a"/>
    <circle cx="269" cy="536" r="70" fill="url(#lamp)"/>
    <rect x="322" y="540" width="34" height="102" fill="#0b0e14"/>
  </g>

  <!-- signpost (Work) -->
  <g>
    <rect x="795" y="382" width="16" height="260" fill="#0e1219"/>
    <rect x="676" y="396" width="212" height="48" rx="4" fill="#141a26"/>
    <rect x="690" y="462" width="184" height="42" rx="4" fill="#141a26"/>
    <rect x="694" y="414" width="150" height="6" rx="3" fill="#6d7a95"/>
    <rect x="706" y="478" width="120" height="6" rx="3" fill="#6d7a95"/>
  </g>

  <!-- mailbox (Contact) -->
  <g>
    <rect x="1196" y="562" width="16" height="82" fill="#0e1219"/>
    <path d="M1148 566 v-32 a56 32 0 0 1 112 0 v32 Z" fill="#141a26"/>
    <rect x="1240" y="512" width="8" height="34" fill="#8d5f4a"/>
  </g>

  <!-- foreground grasses -->
  <g fill="#0a0d13">
    <path d="M0 1000 q60 -120 120 -60 q40 -90 96 -20 q50 -70 92 10 L320 1000 Z"/>
    <path d="M1600 1000 q-70 -140 -140 -66 q-46 -96 -104 -14 q-56 -60 -96 26 L1260 1000 Z"/>
  </g>
</svg>
